name: Update recent projects

on:
  schedule:
    - cron: "17 10 * * *"   # every day around 5 AM Toronto time
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the Recently shipped list
        run: python scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          RECENT_COUNT: "5"
          # Repos that should never appear in the list (coursework, old experiments):
          EXCLUDE_REPOS: "CSI-2510,SEG-2506,CEG-4166,CEG3156,CSI2772,ITI-1520,lab2ceg3155,Project,Portfolio"

      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update recent projects" && git push)

